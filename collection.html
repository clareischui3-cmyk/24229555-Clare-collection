<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Card Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f3efe6;
            margin: 0;
            font-family: 'Newsreader', serif;
            color: #2b2621;
            perspective: 1500px;
        }

        .font-mono-specimen {
            font-family: 'JetBrains Mono', monospace;
        }

        .card-container {
            width: 340px;
            height: 520px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            flex-shrink: 0;
        }

        .card-container.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 1rem;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* Decay effect applied exclusively to standard field values */
        .decay-value {
            transition: filter 15s ease-in-out, opacity 15s ease-in-out, letter-spacing 15s ease-in-out;
            filter: blur(0px);
            opacity: 1;
            letter-spacing: normal;
        }

        .card-container.flipped .decay-value {
            filter: blur(6px);
            opacity: 0.15;
            letter-spacing: 0.25em;
        }

        /* Delayed decay effect for the 'What was not captured' field value */
        .decay-value-delayed {
            transition: filter 15s ease-in-out 10s, opacity 15s ease-in-out 10s, letter-spacing 15s ease-in-out 10s;
            filter: blur(0px);
            opacity: 1;
            letter-spacing: normal;
        }

        .card-container.flipped .decay-value-delayed {
            filter: blur(6px);
            opacity: 0.15;
            letter-spacing: 0.25em;
        }

        /* Custom scrollbar for horizontal scrolling container */
        .horizontal-scroll-container::-webkit-scrollbar {
            height: 8px;
        }
        .horizontal-scroll-container::-webkit-scrollbar-track {
            background: #e6decb;
            border-radius: 4px;
        }
        .horizontal-scroll-container::-webkit-scrollbar-thumb {
            background: #b5a892;
            border-radius: 4px;
        }
        .horizontal-scroll-container::-webkit-scrollbar-thumb:hover {
            background: #9c8e77;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between py-8 px-6">

    <header class="max-w-7xl mx-auto w-full mb-6 flex flex-col sm:flex-row sm:items-end justify-between border-b border-[#d8cebe] pb-4">
        <div>
            <span class="text-xs uppercase tracking-widest text-[#7a6f5d] font-mono-specimen">Archival Exhibition</span>
            <h1 id="collectionTitle" class="text-3xl font-serif text-[#36302a] tracking-tight mt-1">Collection Archive</h1>
        </div>
        <div class="mt-2 sm:mt-0 text-xs font-mono-specimen text-[#7a6f5d]" id="recordCountIndicator">
            Loading records dynamically...
        </div>
    </header>

    <main class="w-full max-w-7xl mx-auto my-auto">
        <div id="cardsWrapper" class="horizontal-scroll-container flex items-center gap-8 overflow-x-auto py-8 px-4 min-h-[560px]">
            <!-- Dynamic cards populated here via record.json -->
        </div>
    </main>

    <footer class="max-w-7xl mx-auto w-full text-center mt-8 text-xs text-[#8c816f] font-mono-specimen">
        &copy; 2026 Field Archive Project — Click "Archive this" to inspect specimen reverse labels.
    </footer>

    <div id="toast" class="fixed bottom-5 right-5 bg-[#2b2621] text-[#f3efe6] px-4 py-2 rounded-lg shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none text-xs font-mono-specimen border border-[#544a40]">
        Record archived successfully.
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadCollectionData();
        });

        // Fallback dataset matching your 15-record json specification for safe offline / blob testing
        const fallbackCollectionData = {
            "collection": "ARTT3005 — starter",
            "records": [
                {

                    "title": "A stack of newspapers in the morning light",

                    "file": "media/A stack of newspapers-01.jpeg",

                    "certainty": 5
                },
                {
                    "id": "REC-002",
                    "title": "Horse racing tips between magazines.",
                    "type": "text",
                    "file": "media/REC-004.txt",
                    "date": "2026-09-04",
                    "place": "Newsstand on Mong Kok street",
                    "recorder": "Clare",
                    "not_captured": "Atmosphere of anxiety and heated discussions when countless horse fans gathered in front of the newsstand",
                    "certainty": 4
                },
                {
                    "id": "REC-003",
                    "title": "The high-pitched sound of coins hitting together",
                    "type": "sound",
                    "file": "media/REC-005.mp3",
                    "date": "2026-09-05",
                    "place": "Newsstand on Mong Kok street",
                    "recorder": "Clare",
                    "not_captured": "The warmth of palms when changing coins",
                    "certainty": 4
                },
                {
                    "id": "REC-004",
                    "title": "Yellow light lit in the evening",
                    "type": "image",
                    "file": "media/Yellow light-04.jpeg",
                    "date": "2026-09-06",
                    "place": "Mong Kok street",
                    "recorder": "Clare",
                    "not_captured": "A buzzing sound from an old light tube inside a light box",
                    "certainty": 3
                },
                {
                    "id": "REC-005",
                    "title": "Tearing off a page of newspaper",
                    "type": "sound",
                    "file": "media/REC-007.mp3",
                    "date": "2026-09-07",
                    "place": "Newsstand on Mong Kok street",
                    "recorder": "Clare",
                    "not_captured": "The resistance at the moment of tearing, and the eagerness of readers to read that news.",
                    "certainty": 4
                },
                {
                    "id": "REC-006",
                    "title": "A water bottle of newspaper stall owner to weigh down the newspapers",
                    "type": "image",
                    "file": "media/Water bottle-06.jpeg",
                    "date": "2026-09-09",
                    "place": "Newsstand on Mong Kok street",
                    "recorder": "Clare",
                    "not_captured": "The evaporation speed of water droplets in the bottle under the sun, and the aging smell of plastic that has been heated for a long time.",
                    "certainty": 5
                },
                {
                    "id": "REC-007",
                    "title": "Flipping newspaper",
                    "type": "sound",
                    "file": "media/REC-010.mp3",
                    "date": "2026-09-10",
                    "place": "Newsstand on Mong Kok street",
                    "recorder": "Clare",
                    "not_captured": "The musty smell of old newspaper due to dryness between the pages",
                    "certainty": 4
                },
                {
                    "id": "REC-008",
                    "title": "Torn canvas tent to keep out the rain",
                    "type": "image",
                    "file": "media/Red canvas-08.jpeg",
                    "date": "2026-09-11",
                    "place": "Newsstand on Mong Kok street",
                    "recorder": "Clare",
                    "not_captured": "The echo of raindrops on the tarp",
                    "certainty": 5
                },
                {
                    "id": "REC-009",
                    "title": "Advertisements plastered all over the walls of newsstand",
                    "type": "text",
                    "file": "media/Advertisments.txt",
                    "date": "2026-09-12",
                    "place": "Newsstand on Mong Kok street",
                    "recorder": "Clare",
                    "not_captured": "The hardened texture of paper after the glue has dried",
                    "certainty": 4
                },
                {
                    "id": "REC-010",
                    "title": "售賣的樽裝蒸餾水與報紙的混雜氣味",
                    "type": "text",
                    "file": "media/REC-014.txt",
                    "date": "2026-09-14",
                    "place": "中環干諾道中報攤",
                    "recorder": "Clare",
                    "not_captured": "傳統報紙檔為了生存被迫轉型兼賣雜貨時的無奈與時代妥協。",
                    "certainty": 4
                },
                {
                    "id": "REC-011",
                    "title": "檔主用原子筆在帳簿上畫的記號",
                    "type": "text",
                    "file": "media/REC-018.txt",
                    "date": "2026-09-18",
                    "place": "九龍城衙前道報攤",
                    "recorder": "Clare",
                    "not_captured": "手部關節因長期勞損而產生的酸痛，以及那本破舊帳簿記錄的微薄利潤。",
                    "certainty": 4
                },
                {
                    "id": "REC-012",
                    "title": "傍晚收攤時拍打紙堆的灰塵聲",
                    "type": "sound",
                    "file": "media/REC-020.mp3",
                    "date": "2026-09-20",
                    "place": "銅鑼灣波斯富街報攤",
                    "recorder": "Clare",
                    "not_captured": "空氣中揚起肉眼看不見的微細粉粒與舊紙屑吸入鼻腔時的真實窒息感。",
                    "certainty": 4
                },
                {
                    "id": "REC-013",
                    "title": "晨早買報人與檔主默契的打招呼聲",
                    "type": "sound",
                    "file": "media/REC-023.mp3",
                    "date": "2026-09-23",
                    "place": "北角春秧街報紙檔",
                    "recorder": "Clare",
                    "not_captured": "那種數十年老街坊之間無需言語的深厚社區連結與人情味。",
                    "certainty": 4
                },
                {
                    "id": "REC-014",
                    "title": "太陽直射下泛黃變脆的副刊封面",
                    "type": "image",
                    "file": "media/REC-024.jpeg",
                    "date": "2026-09-24",
                    "place": "西環德輔道西報攤",
                    "recorder": "Clare",
                    "not_captured": "紫外線對紙張化學結構產生的無情破壞，以及顏色一點一滴褪色的寂靜過程。",
                    "certainty": 5
                },
                {
                    "id": "REC-015",
                    "title": "翻閱時沾上指頭的黑色油墨粉粒",
                    "type": "text",
                    "file": "media/REC-025.txt",
                    "date": "2026-09-25",
                    "place": "深水埗長沙灣道報紙檔",
                    "recorder": "Clare",
                    "not_captured": "印刷油墨沾在皮膚上的真實觸感，以及擦拭不掉的物理殘留痕跡。",
                    "certainty": 4
                }
            ]
        };

        function loadCollectionData() {
            // Fetch live from record.json with cache buster; fallback gracefully if restricted (e.g. file:// or blob protocol)
            if (window.location.protocol === 'blob:') {
                console.warn('Blob protocol detected; loading fallback dataset.');
                renderCollection(fallbackCollectionData);
                return;
            }

            fetch('./record.json?t=' + new Date().getTime(), { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    renderCollection(data);
                })
                .catch(error => {
                    console.warn('Could not fetch record.json live (likely due to local file security restrictions). Loading fallback record dataset:', error);
                    renderCollection(fallbackCollectionData);
                });
        }

        function renderCollection(data) {
            if (data.collection) {
                document.getElementById('collectionTitle').textContent = data.collection + ' — Archive';
            }

            const wrapper = document.getElementById('cardsWrapper');
            wrapper.innerHTML = '';

            const records = data.records || [];
            
            // Update record count indicator dynamically
            document.getElementById('recordCountIndicator').textContent = records.length + ' Specimen' + (records.length === 1 ? '' : 's') + ' Cataloged';

            if (records.length === 0) {
                wrapper.innerHTML = `
                    <div class="w-full text-center py-16 font-mono-specimen text-[#7a6f5d]">
                        <p class="text-sm">No records found in record.json.</p>
                    </div>
                `;
                return;
            }

            // Loop through every record in record.json dynamically
            records.forEach((record, index) => {
                const cardContainer = document.createElement('div');
                cardContainer.className = 'card-container';
                cardContainer.id = 'cardContainer-' + index;

                // Determine media content based on record type or file extension
                let mediaHtml = '';
                const recType = (record.type || '').toLowerCase();
                const fileSrc = record.file || '';

                if (recType === 'image' || fileSrc.match(/\.(jpg|jpeg|png|webp|gif)$/i)) {
                    let imgSrc = fileSrc;
                    if (imgSrc && !imgSrc.startsWith('http') && !imgSrc.startsWith('/')) {
                        imgSrc = './' + imgSrc;
                    }
                    imgSrc = imgSrc || 'https://placehold.co/340x200/e6decb/7a6f5d?text=Specimen+Image';
                    mediaHtml = `
                        <img src="${imgSrc}" alt="${record.title || 'Specimen'}" class="w-full h-full object-cover rounded-xl" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\'text-xs text-[#8c816f] font-mono-specimen\'>Image asset: ${fileSrc}</span>';">
                    `;
                } else if (recType === 'sound' || recType === 'audio' || fileSrc.match(/\.(mp3|wav|ogg|m4a)$/i)) {
                    let audioSrc = fileSrc;
                    if (audioSrc && !audioSrc.startsWith('http') && !audioSrc.startsWith('/')) {
                        audioSrc = './' + audioSrc;
                    }
                    mediaHtml = `
                        <div class="flex flex-col items-center justify-center w-full h-full space-y-3 bg-[#eae2d0] rounded-xl p-4 border border-[#d2c5af]">
                            <div class="w-10 h-10 rounded-full bg-[#dfd4be] flex items-center justify-center text-[#544a40]">
                                <svg class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                            </div>
                            <audio controls class="w-full max-w-[280px] h-8">
                                <source src="${audioSrc}" type="audio/mpeg">
                                Your browser does not support audio.
                            </audio>
                            <span class="text-[10px] text-[#7a6f5d] font-mono-specimen">${fileSrc}</span>
                        </div>
                    `;
                } else {
                    // Text or fallback note
                    const textContent = record.not_captured || record.text_content || fileSrc || 'No additional notes provided.';
                    mediaHtml = `
                        <div class="w-full h-full bg-[#f8f5ee] rounded-xl p-4 flex flex-col justify-center items-center text-center overflow-y-auto border border-[#d8cebe]">
                            <span class="text-[9px] uppercase font-mono-specimen tracking-wider text-[#8c816f] mb-1">Text Specimen (${fileSrc})</span>
                            <p class="text-xs text-[#36302a] font-serif italic leading-relaxed px-2">"${record.title}"</p>
                        </div>
                    `;
                }

                const catId = record.id || ('REC-00' + (index + 1));
                const recTitle = record.title || 'Untitled Specimen';
                const recDate = record.date || 'Unknown Date';
                const recPlace = record.place || 'Unknown Location';
                const recorderName = record.recorder || 'Field Archivist';
                const certaintyVal = record.certainty !== undefined ? (' (Cert: ' + record.certainty + '/5)') : '';
                const notCapturedVal = record.not_captured || 'None recorded.';

                cardContainer.innerHTML = `
                    <!-- Front Face -->
                    <div class="card-face card-front bg-[#faf7f2] rounded-2xl shadow-lg p-5 flex flex-col justify-between border border-[#e2d8c8] box-border">
                        <!-- Media Container -->
                        <div class="w-full h-[200px] bg-[#f0eae1] rounded-xl overflow-hidden flex flex-col items-center justify-center border-2 border-dashed border-[#d2c5af] text-[#8c816f]">
                            ${mediaHtml}
                        </div>

                        <!-- Content Area -->
                        <div class="flex flex-col items-center text-center my-auto pt-3">
                            <span class="mb-1.5 px-2.5 py-0.5 text-[9px] font-mono-specimen font-semibold uppercase tracking-widest bg-[#ede6dc] text-[#544a40] rounded-full">${record.type || 'record'}</span>
                            <h2 class="text-base font-semibold text-[#2b2621] mb-1 leading-snug">${recTitle}</h2>
                            <p class="text-xs text-[#7a6f5d] font-serif">${recDate} — ${recPlace}</p>
                        </div>

                        <!-- Button at the bottom -->
                        <div>
                            <button onclick="handleArchive(${index})" class="w-full py-2.5 bg-[#423a32] hover:bg-[#2b2621] active:bg-[#1a1714] text-[#f3efe6] font-medium rounded-xl transition-all shadow-sm cursor-pointer text-xs font-mono-specimen tracking-wider">
                                Archive this
                            </button>
                        </div>
                    </div>

                    <!-- Back Face (Archival Specimen Label) -->
                    <div class="card-face card-back bg-[#f5efe4] rounded-2xl shadow-lg p-5 flex flex-col justify-between border border-[#c8bc8b]/40 box-border font-mono-specimen">
                        <div>
                            <!-- Catalog Number Header -->
                            <div class="flex justify-between items-center border-b border-[#d8cebe] pb-2.5 mb-3">
                                <span class="text-[10px] tracking-wider text-[#7a6f5d] uppercase">SPECIMEN RECORD</span>
                                <span class="text-[11px] font-bold text-[#423a32]">CAT. #${catId}</span>
                            </div>

                            <!-- Labelled Fields -->
                            <div class="space-y-2.5 text-xs text-[#2b2621]">
                                <div>
                                    <span class="block text-[9px] tracking-wider text-[#7a6f5d] uppercase">Title</span>
                                    <p class="font-medium mt-0.5 decay-value text-[#2b2621]">${recTitle}</p>
                                </div>
                                <div>
                                    <span class="block text-[9px] tracking-wider text-[#7a6f5d] uppercase">Date and place</span>
                                    <p class="font-medium mt-0.5 decay-value text-[#2b2621]">${recDate} — ${recPlace}</p>
                                </div>
                                <div>
                                    <span class="block text-[9px] tracking-wider text-[#7a6f5d] uppercase">Recorded by / Certainty</span>
                                    <p class="font-medium mt-0.5 decay-value text-[#2b2621]">${recorderName}${certaintyVal}</p>
                                </div>
                                <div>
                                    <span class="block text-[9px] tracking-wider text-[#7a6f5d] uppercase">What was not captured</span>
                                    <p class="font-medium mt-0.5 text-[#544a40] italic decay-value-delayed">${notCapturedVal}</p>
                                </div>
                            </div>
                        </div>

                        <!-- Flip Back Button -->
                        <div class="pt-2">
                            <button onclick="handleFlipBack(${index})" class="w-full py-2 bg-[#d8cebe]/40 hover:bg-[#d8cebe] text-[#423a32] text-[11px] font-bold uppercase tracking-wider rounded-lg transition-all cursor-pointer border border-[#c8bc8b]/50">
                                Flip to Front
                            </button>
                        </div>
                    </div>
                `;

                wrapper.appendChild(cardContainer);
            });
        }

        function handleArchive(index) {
            const card = document.getElementById('cardContainer-' + index);
            card.classList.add('flipped');

            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 3000);
        }

        function handleFlipBack(index) {
            const card = document.getElementById('cardContainer-' + index);
            card.classList.remove('flipped');
        }
    </script>
</body>
</html>
