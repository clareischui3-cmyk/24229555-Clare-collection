<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Card Collection — Hong Kong Newsstand Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            /* Nostalgic Hong Kong newsprint & vintage newsstand vibe */
            background-color: #2b2621;
            margin: 0;
            font-family: 'Newsreader', 'Noto Serif TC', serif;
            color: #2b2319;
            perspective: 1500px;
            background-image: 
                linear-gradient(rgba(30, 26, 22, 0.85), rgba(30, 26, 22, 0.85)),
                repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255, 255, 255, 0.02) 3px, rgba(255, 255, 255, 0.02) 6px),
                radial-gradient(rgba(212, 197, 169, 0.15) 1px, transparent 1px);
            background-size: auto, auto, 24px 24px;
        }

        /* Subtle newsprint watermark texture overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.04;
            background-image: repeating-linear-gradient(-45deg, #f4ecd8, #f4ecd8 2px, transparent 2px, transparent 40px);
            z-index: -1;
        }

        /* Vintage decorative border headers & footers with archival flourishes */
        .archival-border-top {
            background: linear-gradient(90deg, transparent, #c2b292 15%, #f4ecd8 50%, #c2b292 85%, transparent);
            height: 3px;
            width: 100%;
            position: relative;
        }
        .archival-border-top::before, .archival-border-top::after {
            content: "❖";
            position: absolute;
            top: -9px;
            color: #f4ecd8;
            font-size: 14px;
        }
        .archival-border-top::before { left: 5%; }
        .archival-border-top::after { right: 5%; }

        .archival-border-bottom {
            background: linear-gradient(90deg, transparent, #c2b292 15%, #f4ecd8 50%, #c2b292 85%, transparent);
            height: 3px;
            width: 100%;
            position: relative;
        }
        .archival-border-bottom::before, .archival-border-bottom::after {
            content: "❖";
            position: absolute;
            top: -9px;
            color: #f4ecd8;
            font-size: 14px;
        }
        .archival-border-bottom::before { left: 5%; }
        .archival-border-bottom::after { right: 5%; }

        .font-mono-specimen {
            font-family: 'JetBrains Mono', monospace;
        }

        .card-container {
            width: 100%;
            max-width: 340px;
            height: 580px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            margin: 0 auto;
        }

        .card-container.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 1rem;
            top: 0;
            left: 0;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* Decay effect applied exclusively to standard field values */
        .decay-value {
            transition: filter 15s ease-in-out, opacity 15s ease-in-out, letter-spacing 15s ease-in-out;
            filter: blur(0px);
            opacity: 1;
            letter-spacing: normal;
        }

        .card-container.flipped .decay-value {
            filter: blur(6px);
            opacity: 0.15;
            letter-spacing: 0.25em;
        }

        /* Delayed decay effect for the 'What was not captured' field value */
        .decay-value-delayed {
            transition: filter 15s ease-in-out 10s, opacity 15s ease-in-out 10s, letter-spacing 15s ease-in-out 10s;
            filter: blur(0px);
            opacity: 1;
            letter-spacing: normal;
        }

        .card-container.flipped .decay-value-delayed {
            filter: blur(6px);
            opacity: 0.15;
            letter-spacing: 0.25em;
        }

        /* Custom scrollbar always visible for text specimen card areas */
        .always-scrollable::-webkit-scrollbar {
            width: 6px;
        }
        .always-scrollable::-webkit-scrollbar-track {
            background: #d8ccb4;
            border-radius: 4px;
        }
        .always-scrollable::-webkit-scrollbar-thumb {
            background: #7a6547;
            border-radius: 4px;
        }
        .always-scrollable::-webkit-scrollbar-thumb:hover {
            background: #4d3f2c;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between py-6 px-4 sm:px-8">

    <header class="max-w-[1550px] mx-auto w-full mb-6">
        <div class="archival-border-top mb-4"></div>
        <div class="flex flex-col sm:flex-row sm:items-end justify-between px-2">
            <div>
                <div class="flex items-center space-x-2">
                    <span class="inline-block bg-[#8b261b] text-[#f4ecd8] text-[10px] font-mono-specimen font-bold px-2 py-0.5 rounded shadow-sm tracking-widest">香港號外</span>
                    <span class="text-xs uppercase tracking-widest text-[#d8ceb8] font-mono-specimen">Hong Kong Newsstand Archive &bull; Field Collection</span>
                </div>
                <h1 id="collectionTitle" class="text-3xl font-serif text-[#f4ecd8] tracking-tight mt-1 font-bold">Collection Archive</h1>
            </div>
            <div class="mt-2 sm:mt-0 text-xs text-[#d8ceb8] font-mono-specimen italic flex items-center space-x-3">
                <span class="bg-[#1a150f] text-[#f4ecd8] px-2.5 py-1 rounded-md text-[10px] tracking-widest font-bold shadow border border-[#524433]">報攤 ARCHIVE</span>
                <span>Specimen Series 2026</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-[1550px] mx-auto my-auto">
        <!-- Exactly 4 columns horizontally grid layout across 5 rows -->
        <div id="cardsWrapper" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 py-4">
            <!-- Dynamic records populated here via records.json fetch -->
        </div>
    </main>

    <footer class="max-w-[1550px] mx-auto w-full mt-10 text-center">
        <div class="archival-border-bottom mb-4"></div>
        <div class="flex flex-col sm:flex-row items-center justify-between text-xs text-[#d8ceb8] font-mono-specimen px-2">
            <p class="tracking-wider">&copy; 2026 Hong Kong Field Archive Project — 舊報攤檔案館</p>
            <p class="mt-2 sm:mt-0 italic opacity-80">"Preserving the fleeting whispers of old street corners & newsprint."</p>
        </div>
    </footer>

    <div id="toast" class="fixed bottom-5 right-5 bg-[#1a150f] text-[#f4ecd8] px-4 py-2 rounded-lg shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none text-xs font-mono-specimen border border-[#7a6547]">
        Record archived successfully.
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadCollectionData();
        });

        function loadCollectionData() {
            fetch('./records.json?t=' + new Date().getTime(), { cache: 'no-store' })
                .then(function(response) {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(function(data) {
                    renderCollection(data);
                })
                .catch(function(error) {
                    console.error('Failed to load records.json:', error);
                    var wrapper = document.getElementById('cardsWrapper');
                    wrapper.innerHTML = '<div class="col-span-full text-center py-16 font-mono-specimen text-[#d8ceb8]"><p class="text-sm font-bold">Failed to load records.json.</p><p class="text-xs mt-2 text-[#c2b292]">Please ensure records.json is present in the directory.</p></div>';
                });
        }

        function renderCollection(data) {
            if (data.collection) {
                document.getElementById('collectionTitle').textContent = data.collection + ' — Archive';
            }

            var wrapper = document.getElementById('cardsWrapper');
            wrapper.innerHTML = '';

            var records = data.records || [];

            if (records.length === 0) {
                wrapper.innerHTML = '<div class="col-span-full text-center py-16 font-mono-specimen text-[#d8ceb8]"><p class="text-sm">No records found in records.json.</p></div>';
                return;
            }

            records.forEach(function(record, index) {
                var cardContainer = document.createElement('div');
                cardContainer.className = 'card-container';
                cardContainer.id = 'cardContainer-' + index;

                var recType = (record.type || '').toLowerCase();
                var fileSrc = record.file || '';
                var mediaHtml = '';

                if (recType === 'image' || fileSrc.match(/\.(jpg|jpeg|png|webp|gif)$/i)) {
                    var imgSrc = fileSrc;
                    if (imgSrc && !imgSrc.startsWith('http') && !imgSrc.startsWith('/')) {
                        imgSrc = './' + imgSrc;
                    }
                    mediaHtml = '<img src="' + imgSrc + '" alt="' + (record.title || 'Specimen') + '" class="w-full h-full object-cover rounded-xl grayscale-[15%] contrast-[105%] sepia-[15%]" onerror="this.onerror=null; this.parentElement.innerHTML=\'<span class=\\\'text-xs text-[#5a4d3f] font-mono-specimen px-2 text-center\\\'>Image asset not found: ' + fileSrc + '</span>\';">';
                } else if (recType === 'sound' || recType === 'audio' || fileSrc.match(/\.(mp3|wav|ogg|m4a)$/i)) {
                    var audioSrc = fileSrc;
                    if (audioSrc && !audioSrc.startsWith('http') && !audioSrc.startsWith('/')) {
                        audioSrc = './' + audioSrc;
                    }
                    mediaHtml = '<div class="flex flex-col items-center justify-center w-full h-full space-y-3 bg-[#c7b79a] rounded-xl p-4 border border-[#ab997a]"><div class="w-10 h-10 rounded-full bg-[#b09e80] flex items-center justify-center text-[#2b2319] shadow-inner"><svg class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg></div><audio controls class="w-full max-w-[240px] h-8" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'block\';"><source src="' + audioSrc + '" type="audio/mpeg">Your browser does not support audio.</audio><span class="text-[10px] text-[#5a4d3f] font-mono-specimen truncate max-w-[220px]" style="display:none;">Audio file not found: ' + fileSrc + '</span><span class="text-[10px] text-[#5a4d3f] font-mono-specimen truncate max-w-[220px]">' + fileSrc + '</span></div>';
                } else {
                    mediaHtml = '<div class="w-full h-full bg-[#f4ecd8] rounded-xl p-4 flex flex-col justify-start items-start text-left overflow-y-scroll always-scrollable border border-[#b8a688] text-file-body"><div class="w-full text-xs not-italic font-serif text-[#1f1b17] whitespace-pre-wrap leading-relaxed">Loading text...</div></div>';
                }

                var catId = record.id || ('REC-00' + (index + 1));
                var recTitle = record.title || 'Untitled Specimen';
                var recDate = record.date || 'Unknown Date';
                var recPlace = record.place || 'Unknown Location';
                var recorderName = record.recorder || 'Field Archivist';
                var certaintyVal = record.certainty !== undefined ? (' (Cert: ' + record.certainty + '/5)') : '';
                var notCapturedVal = record.not_captured || 'None recorded.';

                cardContainer.innerHTML = '' +
                    '<div class="card-face card-front bg-[#e5dbc6] rounded-2xl shadow-xl p-5 flex flex-col justify-between border-2 border-[#bfae92] box-border">' +
                        '<div class="w-full h-[160px] bg-[#d8ccb4] rounded-xl overflow-hidden flex flex-col items-center justify-center border-2 border-dashed border-[#a89679] text-[#5a4d3f] flex-shrink-0 shadow-inner">' +
                            mediaHtml +
                        '</div>' +
                        '<div class="flex flex-col items-center text-center my-auto py-2">' +
                            '<div class="flex items-center space-x-1.5 mb-1.5">' +
                                '<span class="px-2.5 py-0.5 text-[9px] font-mono-specimen font-bold uppercase tracking-widest bg-[#c9bba2] text-[#3b3126] rounded">' + (record.type || 'record') + '</span>' +
                                '<span class="text-[9px] font-mono-specimen text-[#8b261b] font-bold">香港</span>' +
                            '</div>' +
                            '<h2 class="text-sm font-bold text-[#1f1b17] mb-2 leading-snug line-clamp-2">' + recTitle + '</h2>' +
                            '<div class="text-[11px] text-[#4d4033] font-serif leading-snug w-full space-y-1">' +
                                '<span class="block font-semibold text-[#1f1b17]">' + recDate + '</span>' +
                                '<span class="block text-[#43362a] px-1 italic">' + recPlace + '</span>' +
                            '</div>' +
                        '</div>' +
                        '<div class="flex-shrink-0 pt-1">' +
                            '<button onclick="handleArchive(' + index + ')" class="w-full py-2 bg-[#2b2319] hover:bg-[#1a150f] active:bg-[#0a0806] text-[#f4ecd8] font-medium rounded-xl transition-all shadow cursor-pointer text-xs font-mono-specimen tracking-wider border border-[#524433]">' +
                                'Archive this &bull; 翻轉' +
                            '</button>' +
                        '</div>' +
                    '</div>' +
                    '<div class="card-face card-back bg-[#dfd3bc] rounded-2xl shadow-xl p-4 flex flex-col justify-between border-2 border-[#7a5f3f]/50 box-border font-mono-specimen">' +
                        '<div class="flex-grow overflow-y-auto pr-1 flex flex-col min-h-0 always-scrollable">' +
                            '<div class="flex justify-between items-center border-b border-[#b5a386] pb-2 mb-2 flex-shrink-0">' +
                                '<span class="text-[9px] tracking-wider text-[#665540] uppercase font-bold">SPECIMEN RECORD &bull; 檔案</span>' +
                                '<span class="text-[10px] font-bold text-[#8b261b] bg-[#d2c4aa] px-1.5 py-0.5 rounded">CAT. #' + catId + '</span>' +
                            '</div>' +
                            '<div class="space-y-2 text-[11px] text-[#1f1b17] flex-grow">' +
                                '<div>' +
                                    '<span class="block text-[8px] tracking-wider text-[#665540] uppercase font-semibold">Title</span>' +
                                    '<p class="font-medium mt-0.5 decay-value text-[#1f1b17] leading-snug">' + recTitle + '</p>' +
                                '</div>' +
                                '<div>' +
                                    '<span class="block text-[8px] tracking-wider text-[#665540] uppercase font-semibold">Date and place</span>' +
                                    '<div class="font-medium mt-0.5 decay-value text-[#1f1b17] leading-snug space-y-1">' +
                                        '<span class="block text-[#1f1b17] font-semibold">' + recDate + '</span>' +
                                        '<span class="block text-[#43362a] break-words italic">' + recPlace + '</span>' +
                                    '</div>' +
                                '</div>' +
                                '<div>' +
                                    '<span class="block text-[8px] tracking-wider text-[#665540] uppercase font-semibold">Recorded by / Certainty</span>' +
                                    '<p class="font-medium mt-0.5 decay-value text-[#1f1b17]">' + recorderName + certaintyVal + '</p>' +
                                '</div>' +
                                '<div class="pb-1 flex-grow">' +
                                    '<span class="block text-[8px] tracking-wider text-[#665540] uppercase font-semibold mb-0.5">What was not captured</span>' +
                                    '<p class="font-medium text-[#43362a] italic decay-value-delayed whitespace-normal break-words leading-relaxed text-[11px] overflow-visible pr-1">' + notCapturedVal + '</p>' +
                                '</div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="pt-2 mt-2 border-t border-[#b5a386]/50 flex-shrink-0">' +
                            '<button onclick="handleFlipBack(' + index + ')" class="w-full py-1.5 bg-[#d2c4aa] hover:bg-[#bfae92] text-[#2b2319] text-[10px] font-bold uppercase tracking-wider rounded-lg transition-all cursor-pointer border border-[#7a5f3f]/40 shadow-sm">' +
                                'Flip to Front &bull; 返回' +
                            '</button>' +
                        '</div>' +
                    '</div>';

                wrapper.appendChild(cardContainer);

                if (recType === 'text' && fileSrc) {
                    var txtSrc = fileSrc;
                    if (!txtSrc.startsWith('http') && !txtSrc.startsWith('/')) {
                        txtSrc = './' + txtSrc;
                    }
                    var bodyElem = cardContainer.querySelector('.text-file-body div');
                    fetch(txtSrc)
                        .then(function(res) {
                            if (!res.ok) throw new Error('Failed to load text file');
                            return res.text();
                        })
                        .then(function(textContent) {
                            if (bodyElem && textContent.trim()) {
                                bodyElem.textContent = textContent.trim();
                            } else if (bodyElem) {
                                bodyElem.textContent = record.not_captured || record.title;
                            }
                        })
                        .catch(function() {
                            if (bodyElem) {
                                bodyElem.textContent = record.not_captured || record.title;
                            }
                        });
                }
            });
        }

        function handleArchive(index) {
            var card = document.getElementById('cardContainer-' + index);
            card.classList.add('flipped');

            var toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(function() {
                toast.style.opacity = '0';
            }, 3000);
        }

        function handleFlipBack(index) {
            var card = document.getElementById('cardContainer-' + index);
            card.classList.remove('flipped');
        }
    </script>
</body>
</html>
