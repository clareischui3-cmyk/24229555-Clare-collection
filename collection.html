<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Card Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f3efe6;
            margin: 0;
            font-family: 'Newsreader', serif;
            color: #2b2621;
            perspective: 1500px;
            background-image: 
                radial-gradient(#e5dfd3 1px, transparent 1px),
                radial-gradient(#e5dfd3 1px, #f3efe6 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        /* Vintage decorative border headers & footers with archival flourishes */
        .archival-border-top {
            background: linear-gradient(90deg, transparent, #c8bc8b 15%, #8c816f 50%, #c8bc8b 85%, transparent);
            height: 3px;
            width: 100%;
            position: relative;
        }
        .archival-border-top::before, .archival-border-top::after {
            content: "❖";
            position: absolute;
            top: -9px;
            color: #8c816f;
            font-size: 14px;
        }
        .archival-border-top::before { left: 5%; }
        .archival-border-top::after { right: 5%; }

        .archival-border-bottom {
            background: linear-gradient(90deg, transparent, #c8bc8b 15%, #8c816f 50%, #c8bc8b 85%, transparent);
            height: 3px;
            width: 100%;
            position: relative;
        }
        .archival-border-bottom::before, .archival-border-bottom::after {
            content: "❖";
            position: absolute;
            top: -9px;
            color: #8c816f;
            font-size: 14px;
        }
        .archival-border-bottom::before { left: 5%; }
        .archival-border-bottom::after { right: 5%; }

        .font-mono-specimen {
            font-family: 'JetBrains Mono', monospace;
        }

        .card-container {
            width: 100%;
            max-width: 340px;
            height: 580px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            margin: 0 auto;
        }

        .card-container.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 1rem;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* Decay effect applied exclusively to standard field values */
        .decay-value {
            transition: filter 15s ease-in-out, opacity 15s ease-in-out, letter-spacing 15s ease-in-out;
            filter: blur(0px);
            opacity: 1;
            letter-spacing: normal;
        }

        .card-container.flipped .decay-value {
            filter: blur(6px);
            opacity: 0.15;
            letter-spacing: 0.25em;
        }

        /* Delayed decay effect for the 'What was not captured' field value */
        .decay-value-delayed {
            transition: filter 15s ease-in-out 10s, opacity 15s ease-in-out 10s, letter-spacing 15s ease-in-out 10s;
            filter: blur(0px);
            opacity: 1;
            letter-spacing: normal;
        }

        .card-container.flipped .decay-value-delayed {
            filter: blur(6px);
            opacity: 0.15;
            letter-spacing: 0.25em;
        }

        /* Custom scrollbar always visible for text specimen card areas */
        .always-scrollable::-webkit-scrollbar {
            width: 6px;
        }
        .always-scrollable::-webkit-scrollbar-track {
            background: #ede6dc;
            border-radius: 4px;
        }
        .always-scrollable::-webkit-scrollbar-thumb {
            background: #b5a895;
            border-radius: 4px;
        }
        .always-scrollable::-webkit-scrollbar-thumb:hover {
            background: #8c816f;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between py-6 px-4 sm:px-8">

    <header class="max-w-[1550px] mx-auto w-full mb-6">
        <div class="archival-border-top mb-4"></div>
        <div class="flex flex-col sm:flex-row sm:items-end justify-between px-2">
            <div>
                <span class="text-xs uppercase tracking-widest text-[#7a6f5d] font-mono-specimen">Archival Exhibition &bull; Field Collection</span>
                <h1 id="collectionTitle" class="text-3xl font-serif text-[#36302a] tracking-tight mt-1">Collection Archive</h1>
            </div>
            <div class="mt-2 sm:mt-0 text-xs text-[#7a6f5d] font-mono-specimen italic">
                <span>Specimen Series 2026</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-[1550px] mx-auto my-auto">
        <!-- Exactly 4 columns horizontally grid layout across 5 rows -->
        <div id="cardsWrapper" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 py-4">
            <!-- Dynamic records populated here via record.json fetch -->
        </div>
    </main>

    <footer class="max-w-[1550px] mx-auto w-full mt-10 text-center">
        <div class="archival-border-bottom mb-4"></div>
        <p class="text-xs text-[#8c816f] font-mono-specimen tracking-wider">
            &copy; 2026 Field Archive Project — Click "Archive this" to inspect specimen reverse labels.
        </p>
    </footer>

    <div id="toast" class="fixed bottom-5 right-5 bg-[#2b2621] text-[#f3efe6] px-4 py-2 rounded-lg shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none text-xs font-mono-specimen border border-[#544a40]">

        function loadCollectionData() {
            if (window.location.protocol === 'blob:') {
                renderCollection(fallbackCollectionData);
                return;
            }

            fetch('./record.json?t=' + new Date().getTime(), { cache: 'no-store' })
                .then(function(response) {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(function(data) {
                    renderCollection(data);
                })
                .catch(function(error) {
                    console.warn('Live fetch restricted; loading fallback dataset:', error);
                    renderCollection(fallbackCollectionData);
                });
        }

        function renderCollection(data) {
            if (data.collection) {
                document.getElementById('collectionTitle').textContent = data.collection + ' — Archive';
            }

            var wrapper = document.getElementById('cardsWrapper');
            wrapper.innerHTML = '';

            var records = data.records || [];

            if (records.length === 0) {
                wrapper.innerHTML = '<div class="col-span-full text-center py-16 font-mono-specimen text-[#7a6f5d]"><p class="text-sm">No records found in record.json.</p></div>';
                return;
            }

            records.forEach(function(record, index) {
                var cardContainer = document.createElement('div');
                cardContainer.className = 'card-container';
                cardContainer.id = 'cardContainer-' + index;

                var recType = (record.type || '').toLowerCase();
                var fileSrc = record.file || '';
                var mediaHtml = '';

                if (recType === 'image' || fileSrc.match(/\.(jpg|jpeg|png|webp|gif)$/i)) {
                    var imgSrc = fileSrc;
                    if (imgSrc && !imgSrc.startsWith('http') && !imgSrc.startsWith('/')) {
                        imgSrc = './' + imgSrc;
                    }
                    mediaHtml = '<img src="' + imgSrc + '" alt="' + (record.title || 'Specimen') + '" class="w-full h-full object-cover rounded-xl" onerror="this.onerror=null; this.parentElement.innerHTML=\'<span class=\\\'text-xs text-[#8c816f] font-mono-specimen px-2 text-center\\\'>Image asset not found: ' + fileSrc + '</span>\';">';
                } else if (recType === 'sound' || recType === 'audio' || fileSrc.match(/\.(mp3|wav|ogg|m4a)$/i)) {
                    var audioSrc = fileSrc;
                    if (audioSrc && !audioSrc.startsWith('http') && !audioSrc.startsWith('/')) {
                        audioSrc = './' + audioSrc;
                    }
                    mediaHtml = '<div class="flex flex-col items-center justify-center w-full h-full space-y-3 bg-[#eae2d0] rounded-xl p-4 border border-[#d2c5af]"><div class="w-10 h-10 rounded-full bg-[#dfd4be] flex items-center justify-center text-[#544a40]"><svg class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg></div><audio controls class="w-full max-w-[240px] h-8" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'block\';"><source src="' + audioSrc + '" type="audio/mpeg">Your browser does not support audio.</audio><span class="text-[10px] text-[#7a6f5d] font-mono-specimen truncate max-w-[220px]" style="display:none;">Audio file not found: ' + fileSrc + '</span><span class="text-[10px] text-[#7a6f5d] font-mono-specimen truncate max-w-[220px]">' + fileSrc + '</span></div>';
                } else {
                    // Text specimen container with scrollbar always visible, no "Text Specimen" header badge
                    mediaHtml = '<div class="w-full h-full bg-[#f8f5ee] rounded-xl p-4 flex flex-col justify-start items-start text-left overflow-y-scroll always-scrollable border border-[#d8cebe] text-content-area-' + index + '"><div class="w-full text-xs not-italic font-serif text-[#2b2621] text-file-body whitespace-pre-wrap leading-relaxed">Loading text...</div></div>';
                }

                var catId = record.id || ('REC-00' + (index + 1));
                var recTitle = record.title || 'Untitled Specimen';
                var recDate = record.date || 'Unknown Date';
                var recPlace = record.place || 'Unknown Location';
                var recorderName = record.recorder || 'Field Archivist';
                var certaintyVal = record.certainty !== undefined ? (' (Cert: ' + record.certainty + '/5)') : '';
                var notCapturedVal = record.not_captured || 'None recorded.';

                cardContainer.innerHTML = '' +
                    '<div class="card-face card-front bg-[#faf7f2] rounded-2xl shadow-lg p-5 flex flex-col justify-between border border-[#e2d8c8] box-border">' +

                        '<div class="flex-grow overflow-y-auto pr-1 flex flex-col min-h-0 always-scrollable">' +
                            '<div class="flex justify-between items-center border-b border-[#d8cebe] pb-2 mb-2 flex-shrink-0">' +
                                '<span class="text-[9px] tracking-wider text-[#7a6f5d] uppercase">SPECIMEN RECORD</span>' +
                                '<span class="text-[10px] font-bold text-[#423a32]">CAT. #' + catId + '</span>' +
                            '</div>' +
                            '<div class="space-y-2 text-[11px] text-[#2b2621] flex-grow">' +
                                '<div>' +
                                    '<span class="block text-[8px] tracking-wider text-[#7a6f5d] uppercase">Title</span>' +
                                    '<p class="font-medium mt-0.5 decay-value text-[#2b2621] leading-snug">' + recTitle + '</p>' +
                                '</div>' +

                                    '</div>' +

                                '<div>' +
                                    '<span class="block text-[8px] tracking-wider text-[#7a6f5d] uppercase">Recorded by / Certainty</span>' +
                                    '<p class="font-medium mt-0.5 decay-value text-[#2b2621]">' + recorderName + certaintyVal + '</p>' +
                                '</div>' +
                                /* Expandable "What was not captured" block taking as many rows as needed */
                                '<div class="pb-1 flex-grow">' +
                                    '<span class="block text-[8px] tracking-wider text-[#7a6f5d] uppercase mb-0.5">What was not captured</span>' +
                                    '<p class="font-medium text-[#544a40] italic decay-value-delayed whitespace-normal break-words leading-relaxed text-[11px] overflow-visible pr-1">' + notCapturedVal + '</p>' +
                                '</div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="pt-2 mt-2 border-t border-[#d8cebe]/40 flex-shrink-0">' +
                            '<button onclick="handleFlipBack(' + index + ')" class="w-full py-1.5 bg-[#d8cebe]/40 hover:bg-[#d8cebe] text-[#423a32] text-[10px] font-bold uppercase tracking-wider rounded-lg transition-all cursor-pointer border border-[#c8bc8b]/50">' +
                                'Flip to Front' +
                            '</button>' +
                        '</div>' +
                    '</div>';

                wrapper.appendChild(cardContainer);

                // Fetch text files asynchronously with robust fallback if local files aren't found
                if (recType === 'text' && fileSrc) {
                    var txtSrc = fileSrc;
                    if (!txtSrc.startsWith('http') && !txtSrc.startsWith('/')) {
                        txtSrc = './' + txtSrc;
                    }
                    var bodyElem = cardContainer.querySelector('.text-file-body');
                    fetch(txtSrc)
                        .then(function(res) {
                            if (!res.ok) throw new Error('Failed to load text file');
                            return res.text();
                        })
                        .then(function(textContent) {
                            if (bodyElem && textContent.trim()) {
                                bodyElem.textContent = textContent.trim();
                            } else if (bodyElem) {
                                bodyElem.textContent = record.not_captured || record.title;
                            }
                        })
                        .catch(function() {
                            if (bodyElem) {
                                bodyElem.textContent = record.not_captured || record.title;
                            }
                        });
                }
            });
        }

        function handleArchive(index) {
            var card = document.getElementById('cardContainer-' + index);
            card.classList.add('flipped');

            var toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(function() {
                toast.style.opacity = '0';
            }, 3000);
        }

        function handleFlipBack(index) {
            var card = document.getElementById('cardContainer-' + index);
            card.classList.remove('flipped');
        }
    </script>
</body>
</html>
